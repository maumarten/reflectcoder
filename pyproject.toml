[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflectcoder"
version = "0.1.0"
description = "A self-improving coding agent with a reflective failure memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mau Marten" }]
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "groq>=0.11",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
reflectcoder = "reflectcoder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reflectcoder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
